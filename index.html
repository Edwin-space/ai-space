<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI 모델, 에이전트, 스킬, 플러그인, 시장 반응을 한곳에 모은 AI 종합 인텔리전스 허브" />
  <title>AI Space</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="topbar container">
      <a class="brand" href="./">AI SPACE</a>
      <div class="top-actions">
        <button id="searchToggle" class="ghost-btn" type="button">검색</button>
        <a class="ghost-btn" href="https://github.com/Edwin-space/ai-space" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </div>
    <nav class="primary-nav" aria-label="주요 카테고리">
      <div id="primaryNav" class="container nav-scroll"></div>
    </nav>
    <div class="entity-nav">
      <div id="entityNav" class="container nav-scroll"></div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">AI intelligence community</p>
      <h1>AI 업계의 변화가<br/>한곳에 쌓이는 공간</h1>
      <p class="hero-copy">모델 릴리즈부터 Agent, Skills, MCP, 개발 도구, 시장 반응과 커뮤니티 이슈까지. 하나의 콘텐츠를 여러 맥락에서 다시 찾을 수 있도록 축적합니다.</p>
      <div id="activeFilters" class="active-filters"></div>
    </section>

    <section id="searchPanel" class="search-panel hidden">
      <label for="searchInput">전체 검색</label>
      <input id="searchInput" type="search" placeholder="Claude, MCP, Agent, API, 커뮤니티 반응…" autocomplete="off" />
    </section>

    <section class="section-block">
      <div class="section-head"><div><p class="eyebrow">Featured</p><h2>지금 가장 중요한 변화</h2></div></div>
      <div id="featuredGrid" class="featured-grid"></div>
    </section>

    <section class="content-layout">
      <div>
        <div class="section-head"><div><p class="eyebrow">Latest</p><h2 id="latestTitle">최신 콘텐츠</h2></div><span id="resultCount" class="muted"></span></div>
        <div id="latestList" class="latest-list"></div>
      </div>
      <aside>
        <section class="side-card">
          <p class="eyebrow">Trending</p>
          <h3>지금 많이 언급되는 주제</h3>
          <div id="trendingTags" class="tag-cloud"></div>
        </section>
        <section class="side-card">
          <p class="eyebrow">Daily Brief</p>
          <h3>매일 오전 10시</h3>
          <p class="muted">전일 핵심 변화를 종합하고, 개별 이슈는 카테고리와 기업별 콘텐츠로 분해해 누적합니다.</p>
        </section>
      </aside>
    </section>
  </main>

  <template id="storyTemplate">
    <article class="story-card">
      <div class="story-meta"></div>
      <h3></h3>
      <p class="story-summary"></p>
      <div class="story-footer"></div>
    </article>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
